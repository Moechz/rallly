# ===========================================================================
# Rallly for TerraMaster TOS 7 (multi-container Docker application)
# ===========================================================================
# App image : lukevella/rallly:4.17.2 (Docker Hub, multi-arch amd64 + arm64)
# Database  : postgres:16.16-alpine (internal only; kept on 16.x so an existing
#             data directory keeps working - a major upgrade needs pg_upgrade)
#
# Rallly needs a 32+ character application secret at startup; the wrapper
# generates it on first start and stores it in /data instead of hard-coding it
# here. The public address is learned from the first browser request because
# the NAS LAN address is not known inside the container.

services:
  rallydocker:
    image: lukevella/rallly:4.17.2
    container_name: rallydocker
    restart: unless-stopped
    init: true
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    depends_on:
      rallydocker-db:
        condition: service_healthy
    ports:
      - "8143:3000"
    environment:
      TZ: "Asia/Shanghai"
      DATABASE_URL: "postgres://rallly@rallydocker-db:5432/rallly"
      TOS_HOST_PORT: "8143"
      REGISTRATION_ENABLED: "false"
      SUPPORT_EMAIL: "admin@rallydocker.local"
    volumes:
      - /Volume1/DockerAppData/rallydocker/data:/data
      - /Volume1/DockerAppData/rallydocker/cache:/app/apps/web/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "require(\"http\").get(\"http://127.0.0.1:3000/api/status\",r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  rallydocker-db:
    image: postgres:16.16-alpine
    container_name: rallydocker-db
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: "rallly"
      POSTGRES_DB: "rallly"
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - /Volume1/DockerAppData/rallydocker/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rallly -d rallly"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
x-app-meta:
  web:
    port: 8143
    protocol: http
